# LeadFlow production stack for a server that ALREADY has a reverse proxy (Caddy) on ports 80/443.
#   web -> Next.js, api -> FastAPI, db -> Postgres (private, no published port).
# web and api are published only on the Docker bridge address (EDGE_BIND, default 172.16.0.1), so the
# existing Caddy can reach them via host.docker.internal but the internet cannot.
#
# Run from the repo root:
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build
name: leadflow

services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 400m
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: leadflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "${EDGE_BIND:-172.16.0.1}:8100:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://leadflow:${POSTGRES_PASSWORD}@db:5432/leadflow
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      ALLOW_PRIVATE_SMTP: "false"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    mem_limit: 600m
    ports:
      - "${EDGE_BIND:-172.16.0.1}:3100:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
